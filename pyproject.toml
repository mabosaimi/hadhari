[project]
name = "hadhari"
version = "0.1.0"
description = "Arabic spam detection model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.14.1",
    "firebase-admin>=6.7.0",
    "numpy>=2.2.4",
    "polars>=1.26.0",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.11.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

# Suppress noise warnings from untyped third-party ML/DB libraries
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportMissingTypeArgument = false
reportAttributeAccessIssue = false
