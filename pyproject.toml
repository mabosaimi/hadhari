[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hadhari"
version = "0.3.0"
description = "Arabic spam detection model and preprocessing library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.14.1",
    "joblib>=1.4.2",
    "numpy>=2.2.4",
    "scikit-learn>=1.6.1",
]

[project.optional-dependencies]
train = [
    "firebase-admin>=6.7.0",
    "polars>=1.26.0",
    "requests>=2.32.3",
]
dev = [
    "basedpyright>=1.39.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.11.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.11.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hadhari"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

# Suppress noise warnings from untyped third-party ML/DB libraries
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportMissingTypeArgument = false
reportAttributeAccessIssue = false
